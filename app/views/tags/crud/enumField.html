#{field 'object.' + _name}
<label for="${field.id}">
    &{_name}
</label>

<select id="${field.id}" name="${field.name}">
        <option name="none"  value="${null}" ${selected ? 'selected="true"'.raw() : ''}></option>

%{ _property.choices.each() { }%
        %{
                selected = false;
                if(field.error?.message != 'validation.required') {
                    selected = it == _value;
                }
                try {
                    label = it.getCode() + " - " + it.toString();
                } catch(err) {
                    label = it.toString();
                }

        }%
        <option name="${it.name()}" ord="${it.ordinal()}" value="${it.name()}" ${selected ? 'selected="true"'.raw() : ''}>${label}</option>
        %{ } }%
</select>

#{ifError field.name}
    <span class="error">${field.error.raw()}</span>
#{/ifError}
#{/field}
