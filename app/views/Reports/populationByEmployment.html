#{extends 'CRUD/layout.html' /}
*{#{set title:messages.get('crud.list.title', type.name) /}}*

<div id="crudList">

    <h2 id="crudListTitle">&{'crud.list.title', 'Population By Employment'}</h2>

    <table>
        <thead>
            <tr>
                <th>Civil Status</th>
                <th>Sex</th>
                <th>Count</th>
            </tr>
        </thead>
        <tbody>
            #{list items:records, as:'record'}
                <tr>
                    <td>${record.cs}</td>
                    <td>${record.sex}</td>
                    <td>${record.count}</td>
                </tr>
            #{/list}
        </tbody>
    </table>

</div>
