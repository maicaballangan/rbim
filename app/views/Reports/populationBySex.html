#{extends 'CRUD/layout.html' /}
*{#{set title:messages.get('crud.list.title', type.name) /}}*

<div id="crudList">

    <h2 id="crudListTitle">&{'crud.list.title', 'Population By Sex'}</h2>

    <table>
        <thead>
            <tr>
                <th>Barangay</th>
                <th>Count</th>
                <th>Percent</th>
            </tr>
        </thead>
        <tbody>
            #{list items:records, as:'record'}
                <tr>
                    <td>${record.sex}</td>
                    <td>${record.count}</td>
                    <td>${record.percent}</td>
                </tr>
            #{/list}
        </tbody>
    </table>

</div>
