<!DOCTYPE html>

<html lang="${lang}">
    <head>
        <title>#{get 'title' /}</title>
        <meta charset="${_response_encoding}" />
        <link rel="stylesheet" media="screen" href="@{'/public/stylesheets/crud.css'}" />
        <script src="https://kit.fontawesome.com/cae090ad32.js" crossorigin="anonymous"></script>
    </head>
    <body id="crud">

        <div id="crudHeader">
            <h1><a href="@{CRUD.index()}">&{'crud.title'}</a></h1>
            <div id="nav">
                <a href="@{Application.upload()}"><i class="fas fa-upload"> Import</i></a>
                &nbsp
                <a href="@{Secure.logout()}"><i class="fas fa-sign-out-alt"> Logout</i></a>
            </div>
        </div>

#{if request.actionMethod != 'index'}
            <div id="crudBreadcrumb">
                #{crud.navigation /}
            </div>
#{/if}

#{if flash.success}
            <div class="crudFlash flashSuccess">
                ${flash.success}
            </div>
#{/if}
#{if flash.error || error}
            <div class="crudFlash flashError">
                ${error ?: flash.error}
            </div>
#{/if}

        <div id="crudContent">
#{doLayout /}
        </div>

        <div id="crudFooter">
            © 2022 Jamaica Ballangan. All rights reserved.
        </div>

    </body>
</html>
