<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>#{get 'title' /}</title>
    <meta charset="${_response_encoding}">
    <link rel="stylesheet" type="text/css" href="@{'/public/bootstrap/css/bootstrap.min.css'}">
    <link rel="stylesheet" type="text/css" href="@{'/public/fontawesome/css/all.min.css'}">
    <link rel="stylesheet" media="screen" href="@{'/public/stylesheets/main.css'}">
    #{get 'moreStyles' /}
    <link rel="shortcut icon" type="image/png" href="@{'/public/images/favicon.png'}'">

</head>
<body>
<nav class="navbar navbar-expand sticky-top navbar-light bg-light">
    <div class="container">
        <a
                class="navbar-brand"
                @if(request.uri() != "/"){
                onclick="return confirm('You are about to redirect to the Home page. Your session will be reset. Are you sure?');"
                }
                href="@routes.HomeController.index()">
            <img src="@{'/public/images/navbar-logo.png'}'"  alt="navbar-logo"/>
        </a>
    </div>
</nav>
<div id="banner">
    <div class="container">
        <div class="main">
            <h4 class="pre-heading">Popcom RBIM</h4>
            <h1 class="heading">RBIM</h1>
        </div>
        <div class="meta">

        </div>
    </div>
</div>

#{doLayout /}


<div class="footer-border"></div>
<footer>
    <p>
        &copy; Created by Maica Ballangan
    </p>
</footer>

<script type="text/javascript" src="@{'/public/bootstrap/js/bootstrap.min.js'}">
</script>
<script type="text/javascript" src="@{'/public/fontawesome/js/all.min.js'}'">
</script>
<script src="@{'/public/javascripts/jquery-1.6.4.min.js'}" type="text/javascript" charset="${_response_encoding}"></script>
#{get 'moreScripts' /}
</body>
</html>
